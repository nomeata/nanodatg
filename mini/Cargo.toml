[package]
name = "mini"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "A Rust port of lean-mini-kernel, to be made evidence-passing"

# ─────────────────────────────────────────────────────────────────────────────
# UNTRUSTED, like `checker`. `mini` is a second, much smaller consumer of the
# trusted `kernel`: a port of https://github.com/nomeata/lean-mini-kernel,
# built with no caches so that the evidence-threading design had nothing
# confounding it. See MINI-DESIGN.md.
#
# **The representation is converging with `checker`'s** (PIVOT.md §1.1): terms
# live in a hash-consed `checker` arena reached through `mini/src/arena.rs`,
# which is the only module here that names `TcCtx`. Mini still never enters
# `tc.rs` or `tg.rs`.
#
# It no longer requires `checker/` to be unchanged — PIVOT.md §6 inverts that
# rule deliberately, since the old one existed to protect `checker/` from
# mini's fidelity experiment. Upstream files take minimal, cited edits (today:
# one `pub(crate)` -> `pub` on `TcCtx::alloc_string`), new capability lands in
# new files, and `git diff nanoda-upstream/master -- checker/` remains the
# advertised audit artefact.
# ─────────────────────────────────────────────────────────────────────────────

[dependencies]
kernel = { path = "../kernel" }
derived = { path = "../derived" }
nanoda_lib = { path = "../checker" }
serde_json = "1.0.111"
# For `arena::nat_lit` only: `checker`'s `NatLit` holds a `BigUint`, and the
# arena seam is the one place mini has to build one. Mini's own literals stay
# `u64` — the parser declines anything above ten.
num-bigint = "0.4.4"

[[bin]]
name = "mini"
path = "src/main.rs"
