[package]
name = "nanoda_lib"
version = "0.4.10-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ammkrn/nanoda_lib"
description = "A type checker for the Lean 4 programming language and theorem prover"
publish = false

# ─────────────────────────────────────────────────────────────────────────────
# UNTRUSTED. This crate is a fork of ammkrn's nanoda_lib (Apache-2.0); see
# checker/LICENSE and the top-level NOTICE. Nothing here needs to be correct for
# soundness: a bug in this crate yields a *rejection*, never a false theorem.
# The trusted component is the `kernel` crate, which this one drives through the
# `Certifier` proof-backend trait.
#
# Profiles live in the workspace root Cargo.toml (they are workspace-global and
# are ignored in member manifests).
# ─────────────────────────────────────────────────────────────────────────────

[features]
# Definitional-equality step counting (src/stepcount.rs). Off by default: it is
# a measurement probe, and when disabled `stepcount::bump` compiles to nothing.
stepcount = []
# Use the real Tarski–Grothendieck proof backend instead of `NullCertifier`, so
# that definitional-equality certificates are actual kernel theorems.
tg = []

[dev-dependencies]
rand = "0.8.5"
num-bigint = { version = "0.4.4", features = ["rand", "serde"] }

[dependencies]
kernel = { path = "../kernel" }
derived = { path = "../derived" }
indexmap = "2.13.0"
rustc-hash = "1.1.0"
num-bigint = { version = "0.4.4", features = ["serde"] }
num-integer = "0.1.46"
num-traits = "0.2.17"
semver = "1.0.27"
serde_json = "1.0.111"
serde = { version = "1.0.228", features = ["derive"] }

[[bin]]
name = "nanoda_bin"
path = "src/main.rs"
bench = false
