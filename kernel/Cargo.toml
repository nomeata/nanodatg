[package]
name = "kernel"
version = "0.0.0"
edition = "2021"
publish = false

# ─────────────────────────────────────────────────────────────────────────────
# TRUSTED COMPUTING BASE.
#
# This crate is the ONLY component that must be correct for soundness. It has,
# and must keep having, NO external dependencies. The single sanctioned future
# exception is a vetted bignum crate for native arithmetic (milestone 4); when
# that is added it must be pinned, vetted, and documented as a TCB entry in
# kernel/README.md. Do not add anything else here.
# ─────────────────────────────────────────────────────────────────────────────
#
# No `[features]` table, deliberately. The crate had one — `null-certifier` —
# gating a `NullCertifier` that no longer lives here. It was on by default and
# nothing ever turned it off, so it gated nothing. The obligation it stood for,
# that the null backend be unreachable in a release build once the real one
# exists, is now enforced rather than intended: `NullCertifier` sits in
# `checker/src/certify.rs` behind `cfg(not(feature = "tg"))`, so a
# `--features tg` build does not compile it at all.
[dependencies]
